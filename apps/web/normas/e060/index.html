<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Norma E.060 Concreto Armado · texto completo · Tekluma</title>
    <meta name="description" content="La Norma E.060 Concreto Armado del RNE, completa y buscable: 22 capítulos, 1 621 artículos, figuras y la página original de cada uno." />
    <meta property="og:title" content="Norma E.060 Concreto Armado · Tekluma" />
    <meta property="og:description" content="Busca cualquier artículo de la E.060 y llega directo a su texto, sus figuras y su página original." />
    <meta property="og:type" content="article" />
    <meta name="theme-color" content="#F6F5F2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F1B2D" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=20261110" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@500;600;700;800&display=swap" />
    <link rel="stylesheet" href="/estilos.css?v=20261110" />
    <style>
      .lector { display: grid; grid-template-columns: 1fr; gap: 0; }
      @media (min-width: 960px) { .lector { grid-template-columns: 280px 1fr; } }
      .lector-indice { display: none; }
      @media (min-width: 960px) {
        .lector-indice { display: block; position: sticky; top: 0; height: 100vh; overflow-y: auto; border-right: 1px solid var(--linea); padding: var(--e5) var(--e4) var(--e5) 0; }
      }
      .lector-indice a { display: flex; gap: var(--e3); padding: 7px var(--e2); border-radius: var(--radio); text-decoration: none; font-size: 14px; color: var(--tinta-2); line-height: 1.35; }
      .lector-indice a:hover, .lector-indice a.actual { background: var(--acento-suave); color: var(--tinta); }
      .lector-indice a span { font-family: var(--mono); color: var(--ambar); min-width: 22px; }
      .lector-cuerpo { min-width: 0; padding: 0 0 var(--e8) 0; }
      @media (min-width: 960px) { .lector-cuerpo { padding-left: var(--e6); } }
      .lector-barra { position: sticky; top: 0; z-index: 5; background: var(--fondo); padding: var(--e4) 0 var(--e3); border-bottom: 1px solid var(--linea); }
      .lector-barra .etq { display: block; margin-bottom: var(--e2); }
      .lector-buscar { display: flex; align-items: center; gap: var(--e2); border: 1px solid var(--linea-fuerte); background: var(--superficie); border-radius: 6px; padding: 0 var(--e3); }
      .lector-buscar:focus-within { border-color: var(--ambar); }
      .lector-buscar input { flex: 1; border: 0; background: transparent; color: var(--tinta); font: inherit; font-size: 16px; height: 46px; outline: none; }
      .lector-buscar svg { flex: none; }
      .lector-capitulos { display: flex; gap: var(--e2); overflow-x: auto; padding-top: var(--e3); scrollbar-width: none; }
      @media (min-width: 960px) { .lector-capitulos { display: none; } }
      .lector-capitulos a { flex: none; font-family: var(--mono); font-size: 12px; border: 1px solid var(--linea); border-radius: var(--radio); padding: 4px 9px; text-decoration: none; color: var(--tinta-2); }
      .capitulo { padding-top: var(--e7); scroll-margin-top: 140px; }
      .capitulo h2 { display: flex; align-items: baseline; gap: var(--e3); font-size: 26px; line-height: 1.2; margin: 0 0 var(--e3); letter-spacing: -0.01em; }
      .capitulo h2 span { font-family: var(--mono); font-size: 14px; color: var(--ambar); font-weight: 500; }
      .art { position: relative; padding: var(--e3) var(--e4); margin: 0 calc(-1 * var(--e4)); border-radius: var(--radio); scroll-margin-top: 150px; transition: background 1.2s ease; }
      .art.destacado { background: var(--acento-suave); box-shadow: inset 4px 0 0 var(--ambar); }
      .art .num { font-family: var(--mono); font-weight: 500; color: var(--ambar); font-size: 14px; text-decoration: none; margin-right: var(--e3); }
      .art .epi { font-weight: 700; }
      /* La fuente convierte «(c)» en «©»: en la norma los incisos (a), (b), (c) deben verse tal cual. */
      .art, .resultado { font-feature-settings: "calt" 0, "liga" 0; }
      .art p { margin: 6px 0 0; white-space: pre-line; max-width: 72ch; }
      .art .formula { display: flex; align-items: center; justify-content: space-between; gap: var(--e4); max-width: 72ch; margin: 10px 0 4px; padding: 10px 16px; border: 1px solid var(--linea); border-radius: 6px; background: var(--superficie); font-family: Georgia, "Times New Roman", serif; font-style: italic; font-variant-numeric: lining-nums; font-size: 18px; line-height: 1.45; }
      .art .formula .mj { overflow-x: auto; font-style: normal; font-size: 19px; max-width: 100%; }
      .art .formula .mj svg, .art .tabla .mj svg, .definicion .mj svg { display: block; }
      .art .tabla .mj { font-size: 16px; }
      .sim { font-style: italic; }
      .sim sub { font-size: 0.72em; }
      .definicion { display: grid; grid-template-columns: 76px 1fr; gap: 12px; align-items: center; max-width: 72ch; padding: 6px 0; border-top: 1px solid var(--linea); font-size: 15px; }
      .definicion .mj { font-size: 18px; }
      .art .formula .eq { font-family: var(--mono); font-style: normal; font-size: 13px; color: var(--ambar); white-space: nowrap; }
      .art .tabla { max-width: 100%; overflow-x: auto; margin: 10px 0 4px; }
      .art .tabla table { border-collapse: collapse; font-size: 15px; line-height: 1.4; min-width: 60%; }
      .art .tabla th, .art .tabla td { border: 1px solid var(--linea); padding: 7px 10px; text-align: left; vertical-align: top; }
      .art .tabla caption { text-align: left; font-family: var(--mono); font-size: 12px; letter-spacing: 0.04em; color: var(--tinta-3); padding-bottom: 6px; }
      .art .tabla th { font-family: var(--mono); font-size: 12px; font-weight: 500; color: var(--tinta-2); background: var(--superficie); }
      .art.seccion { padding-top: var(--e5); }
      .art.seccion .epi { font-size: 19px; font-weight: 800; }
      .art .acciones { display: flex; gap: var(--e2); margin-top: var(--e2); opacity: 0; transition: opacity 0.15s; }
      .art:hover .acciones, .art.destacado .acciones, .art:focus-within .acciones { opacity: 1; }
      @media (hover: none) { .art .acciones { opacity: 1; } }
      .chip { font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; border: 1px solid var(--linea); border-radius: var(--radio); padding: 3px 8px; background: none; color: var(--tinta-3); cursor: pointer; text-decoration: none; }
      .chip:hover { border-color: var(--ambar); color: var(--tinta); }
      .figura { margin: var(--e3) 0 0; background: #fff; border: 1px solid var(--linea); border-radius: 6px; max-width: 720px; overflow: hidden; cursor: zoom-in; }
      .figura img { display: block; width: 100%; height: auto; }
      .figura figcaption { font-size: 13px; font-style: italic; color: #5b6b85; padding: 8px 12px; }
      .resultados { padding-top: var(--e3); }
      .resultado { display: block; padding: var(--e3) var(--e2); border-bottom: 1px solid var(--linea); text-decoration: none; }
      .resultado:hover { background: var(--acento-suave); }
      .resultado strong { margin-left: var(--e2); }
      .resultado p { margin: 4px 0 0; color: var(--tinta-2); font-size: 15px; }
      mark { background: rgba(255, 138, 31, 0.28); color: inherit; font-weight: 700; border-radius: 2px; }
      .cta-app { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--e3); margin-top: var(--e5); padding: var(--e4) var(--e5); border: 1px solid var(--linea-fuerte); border-radius: 6px; background: var(--superficie); }
      .cta-app p { margin: 0; max-width: 56ch; }
      dialog { border: 0; padding: 0; background: #0f1b2d; color: #f6f5f2; max-width: min(900px, 96vw); width: 100%; max-height: 96vh; border-radius: 6px; }
      dialog::backdrop { background: rgba(15, 27, 45, 0.7); }
      dialog .barra { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; font-family: var(--mono); font-size: 13px; }
      dialog .barra button { background: none; border: 1px solid #3b5174; color: #f6f5f2; border-radius: 3px; padding: 4px 10px; cursor: pointer; font: inherit; }
      dialog .lienzo { overflow: auto; max-height: calc(96vh - 50px); background: #fff; }
      dialog img { display: block; width: 100%; height: auto; }
      .cargando { padding: var(--e7) 0; color: var(--tinta-3); font-family: var(--mono); font-size: 13px; letter-spacing: 0.08em; }
    </style>
  </head>
  <body>
    <header class="cabecera">
      <div class="hoja">
        <a class="marca" href="/" aria-label="Tekluma, inicio">
          <picture><source srcset="/logo-oscuro.svg?v=20261110" media="(prefers-color-scheme: dark)" /><img src="/logo.svg?v=20261110" alt="Tekluma" width="105" height="26" /></picture>
        </a>
        <nav aria-label="Principal">
          <span class="etq ref">Norma · E.060</span>
          <a href="/">Qué es Tekluma</a>
        </nav>
      </div>
    </header>

    <div class="hoja lector">
      <aside class="lector-indice" aria-label="Capítulos" id="indice"></aside>
      <main class="lector-cuerpo">
        <div class="lector-barra">
          <span class="etq" id="rotulo">E.060 · Concreto Armado</span>
          <label class="lector-buscar">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6" /><line x1="15" y1="15" x2="20.5" y2="20.5" /></svg>
            <input id="buscar" type="search" placeholder="Buscar: 21.6.4, gancho sísmico, recubrimiento…" aria-label="Buscar en la norma" autocomplete="off" />
          </label>
          <nav class="lector-capitulos" id="capitulos" aria-label="Capítulos"></nav>
        </div>
        <div id="resultados" class="resultados" hidden></div>
        <div id="texto"><p class="cargando">CARGANDO LA NORMA…</p></div>
      </main>
    </div>

    <dialog id="visor" aria-label="Página original">
      <div class="barra"><span id="visor-titulo"></span><span><button id="visor-ant" aria-label="Página anterior">‹</button> <button id="visor-sig" aria-label="Página siguiente">›</button> <button id="visor-cerrar">Cerrar</button></span></div>
      <div class="lienzo"><img id="visor-img" alt="" /></div>
    </dialog>

    <footer class="pie">
      <div class="hoja">
        <div class="cajetin">
          <div class="doble"><span class="etq">Proyecto</span><a class="marca-pie" href="/" aria-label="Tekluma, inicio"><picture><source srcset="/logo-oscuro.svg?v=20261110" media="(prefers-color-scheme: dark)" /><img src="/logo.svg?v=20261110" alt="Tekluma" width="81" height="20" /></picture></a></div>
          <div><span class="etq">Fuente</span><span>DS N° 010-2009-VIVIENDA</span></div>
          <div><span class="etq">Documentos</span><span class="vinculos"><a href="/terminos">Términos</a><a href="/privacidad">Privacidad</a></span></div>
          <div><span class="etq">Contacto</span><a href="mailto:hola@tekluma.app">hola@tekluma.app</a></div>
          <div><span class="etq">Año</span><span class="mono">© 2026</span></div>
        </div>
      </div>
    </footer>

    <script>
      const $ = (id) => document.getElementById(id);
      const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
      const normal = (s) => s.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[′’´`]/g, "'").toLowerCase();
      const variantes = { a: "aáàä", e: "eéèë", i: "iíìï", o: "oóòö", u: "uúùü", n: "nñ" };
      const patron = (terminos) => {
        const p = terminos.filter((t) => t.length > 1).map((t) => [...t].map((c) => (variantes[c] ? `[${variantes[c]}]` : c.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"))).join(""));
        return p.length ? new RegExp(`(${p.join("|")})`, "gi") : null;
      };
      const marcar = (texto, re) => (re ? esc(texto).replace(re, "<mark>$1</mark>") : esc(texto));
      const pagina = (n) => `paginas/p${String(n).padStart(3, "0")}.jpg`;
      let norma = null, normales = null, paginaVisor = 1;

      fetch("norma.json", { cache: "no-cache" })
        .then((r) => r.json())
        .then((n) => { norma = n; pintar(); irAlHash(); })
        .catch(() => { $("texto").innerHTML = '<p class="cargando">NO SE PUDO CARGAR LA NORMA. RECARGA LA PÁGINA.</p>'; });

      // Fórmulas numeradas («Vc = 0,17 √f’c bw d (11-3)») y tablas («| celda | celda»), como en la app.
      // Símbolos de la notación (Vc, f’c, ℓd) con su subíndice: V<sub>c</sub>.
      const LETRAS = "A-Za-zÁÉÍÓÚÑáéíóúñ0-9’′ℓαβγδεθλμξπρσφψωΔΣΨΩ";
      let reSimbolos = null;
      const conSimbolos = (texto) => {
        const html = esc(texto);
        if (!reSimbolos) return html;
        return html.replace(reSimbolos, (_, antes, s) => {
          const corte = /^[ΣΔφ]?.[’′]?/.exec(s)[0].length;
          return `${antes}<span class="sim">${s.slice(0, corte)}<sub>${s.slice(corte)}</sub></span>`;
        });
      };
      const dibujo = (f, clase = "") => `<span class="mj ${clase}">${f.svg}</span>`;

      // Fórmulas dibujadas con MathJax (Vc = 0,17 √f’c bw d → SVG), tablas («| celda | celda») y la notación de 2.1.
      function cuerpo(texto, notacion) {
        const F = norma.formulas || {};
        let html = "", parrafo = [], tabla = null;
        const cerrarParrafo = () => { if (parrafo.length) html += `<p>${conSimbolos(parrafo.join("\n"))}</p>`; parrafo = []; };
        const celda = (c, i) => (F[c] ? `<td>${dibujo(F[c])}</td>` : i ? `<td>${conSimbolos(c)}</td>` : `<th>${esc(c)}</th>`);
        const cerrarTabla = () => {
          if (tabla) html += `<div class="tabla"><table>${tabla.titulo ? `<caption>${esc(tabla.titulo)}</caption>` : ""}${tabla.map((f, i) => `<tr>${f.map((c) => celda(c, i)).join("")}</tr>`).join("")}</table></div>`;
          tabla = null;
        };
        for (const bruta of texto.split("\n")) {
          const l = bruta.trim();
          if (l.startsWith("|")) {
            if (!tabla) { const k = parrafo.findLastIndex((x) => /^tabla\s+\d/i.test(x)); tabla = []; if (k >= 0) tabla.titulo = parrafo.splice(k).join(" "); }
            cerrarParrafo(); tabla.push(l.slice(1).split("|").map((c) => c.trim())); continue; }
          cerrarTabla();
          const d = notacion ? /^(\S+(?: \S+)?) = (.+)$/.exec(l) : null;
          if (d && F[d[1]]) {
            cerrarParrafo();
            html += `<div class="definicion"><span class="def-sim">${dibujo(F[d[1]])}</span><span>${conSimbolos(d[2])}</span></div>`;
            continue;
          }
          const m = l.length <= 130 ? /^(.+?)\s*\((\d{1,2}-\d{1,2}[a-z]?)\)$/.exec(l) : null;
          if (m && l !== l.toUpperCase() && (/[=≤≥<>]/.test(m[1]) || m[1].length < 40)) {
            cerrarParrafo();
            html += `<div class="formula">${F[m[1]] ? dibujo(F[m[1]]) : `<span>${esc(m[1])}</span>`}<span class="eq">(${m[2]})</span></div>`;
          } else if (F[l]) {
            cerrarParrafo();
            html += `<div class="formula">${dibujo(F[l])}</div>`;
          } else if (l) parrafo.push(l);
        }
        cerrarParrafo(); cerrarTabla();
        return html;
      }

      function pintar() {
        const lista = (norma.simbolos || []).filter((x) => x !== x.toUpperCase()).sort((a, b) => b.length - a.length).map((x) => x.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
        reSimbolos = lista.length ? new RegExp(`(^|[^${LETRAS}])(${lista.join("|")})(?![${LETRAS}])`, "g") : null;
        $("rotulo").textContent = `${norma.codigo} · ${norma.titulo} · ${norma.articulos.length.toLocaleString("es-PE")} artículos`;
        $("indice").innerHTML = norma.capitulos.map((c) => `<a href="#cap-${c.n}"><span>${c.n.padStart(2, "0")}</span>${esc(c.titulo)}</a>`).join("");
        $("capitulos").innerHTML = norma.capitulos.map((c) => `<a href="#cap-${c.n}" title="${esc(c.titulo)}">Cap. ${c.n}</a>`).join("");
        const caps = new Map(norma.capitulos.map((c) => [c.n, c]));
        let actual = "", html = "";
        for (const a of norma.articulos) {
          const cap = a.n.split(".")[0];
          if (cap !== actual && caps.has(cap)) {
            if (actual) html += "</section>";
            actual = cap;
            html += `<section class="capitulo" id="cap-${cap}"><h2><span>CAPÍTULO ${cap}</span>${esc(caps.get(cap).titulo)}</h2>`;
          }
          const seccion = a.e && normal(a.t.trim()) === normal(a.e.trim());
          html += `<article class="art${seccion ? " seccion" : ""}" id="${a.n}">`;
          html += `<a class="num" href="#${a.n}">${a.n}</a>${a.e ? `<span class="epi">${esc(a.e)}</span>` : ""}`;
          if (!seccion) html += cuerpo(a.t, a.n === "2.1");
          for (const f of a.f || []) html += `<figure class="figura" data-src="${f.src}"><img loading="lazy" src="${f.src}" width="${f.w}" height="${f.h}" alt="${esc(f.pie)}" /><figcaption>${esc(f.pie)}</figcaption></figure>`;
          if (!seccion && a.p) html += `<div class="acciones"><button class="chip" data-pagina="${a.p}">PÁG. ${a.p} · ORIGINAL</button><button class="chip" data-copiar="${a.n}">COPIAR ENLACE</button></div>`;
          html += "</article>";
        }
        $("texto").innerHTML = html + "</section>" +
          `<div class="cta-app"><p><strong>¿Estudias para obra o colegiatura?</strong> En la app Tekluma tienes la E.060 en tarjetas, la pregunta del día y duelos con colegas. Cada respuesta te trae justo a este artículo.</p><a class="boton primario" href="/">Conocer Tekluma</a></div>`;
      }

      function irAlHash() {
        const id = decodeURIComponent(location.hash.slice(1));
        if (!id) return;
        const el = document.getElementById(id) || document.getElementById(id.split(".").slice(0, -1).join("."));
        if (!el) return;
        document.querySelectorAll(".art.destacado").forEach((x) => x.classList.remove("destacado"));
        if (el.classList.contains("art")) el.classList.add("destacado");
        el.scrollIntoView({ block: "start" });
        document.title = el.classList.contains("art") ? `E.060 Art. ${id} · Tekluma` : document.title;
      }
      addEventListener("hashchange", () => { cerrarBusqueda(); irAlHash(); });

      $("buscar").addEventListener("input", (e) => buscar(e.target.value));
      function cerrarBusqueda() { $("buscar").value = ""; $("resultados").hidden = true; $("texto").hidden = false; }
      function buscar(consulta) {
        const q = normal(consulta.trim());
        if (!q) return cerrarBusqueda();
        let hallados;
        if (/^\d+(\.\d+)*\.?$/.test(q)) {
          const n = q.replace(/\.$/, "");
          hallados = norma.articulos.filter((a) => a.n === n || a.n.startsWith(`${n}.`)).slice(0, 80);
        } else {
          normales ??= norma.articulos.map((a) => normal(`${a.e ?? ""}\n${a.t}`));
          const terminos = q.split(/\s+/);
          hallados = norma.articulos
            .map((a, i) => ({ a, i, puntos: terminos.every((t) => normales[i].includes(t)) ? terminos.reduce((p, t) => p + (normal(a.e ?? "").includes(t) ? 5 : 0) + Math.min(normales[i].split(t).length - 1, 5), 0) : -1 }))
            .filter((r) => r.puntos >= 0)
            .sort((x, y) => y.puntos - x.puntos || x.i - y.i)
            .slice(0, 80)
            .map((r) => r.a);
        }
        const re = patron(q.split(/\s+/));
        const frag = (a) => {
          const t = a.t.replace(/\s+/g, " ").trim(), nt = normal(t);
          const pos = Math.max(0, Math.min(...q.split(/\s+/).map((x) => nt.indexOf(x)).filter((i) => i >= 0), 0 + nt.length) - 60);
          return (pos ? "…" : "") + t.slice(pos, pos + 200) + (pos + 200 < t.length ? "…" : "");
        };
        $("texto").hidden = true;
        $("resultados").hidden = false;
        $("resultados").innerHTML = `<p class="etq">${hallados.length ? `${hallados.length}${hallados.length === 80 ? "+" : ""} artículos` : "Sin resultados"}</p>` +
          hallados.map((a) => `<a class="resultado" href="#${a.n}"><span class="num mono" style="color:var(--ambar)">${a.n}</span>${a.e ? `<strong>${marcar(a.e, re)}</strong>` : ""}<p>${marcar(frag(a), re)}</p></a>`).join("");
      }

      const visor = $("visor");
      function abrirPagina(n) {
        paginaVisor = Math.min(Math.max(1, n), norma.paginas);
        $("visor-img").src = pagina(paginaVisor);
        $("visor-titulo").textContent = `PÁG. ${paginaVisor} / ${norma.paginas}`;
        if (!visor.open) visor.showModal();
      }
      $("visor-ant").onclick = () => abrirPagina(paginaVisor - 1);
      $("visor-sig").onclick = () => abrirPagina(paginaVisor + 1);
      $("visor-cerrar").onclick = () => visor.close();
      visor.addEventListener("click", (e) => { if (e.target === visor) visor.close(); });

      $("texto").addEventListener("click", (e) => {
        const p = e.target.closest("[data-pagina]");
        if (p) return abrirPagina(Number(p.dataset.pagina));
        const c = e.target.closest("[data-copiar]");
        if (c) {
          navigator.clipboard?.writeText(`${location.origin}${location.pathname}#${c.dataset.copiar}`);
          c.textContent = "ENLACE COPIADO";
          setTimeout(() => (c.textContent = "COPIAR ENLACE"), 1600);
          return;
        }
        const f = e.target.closest("figure[data-src]");
        if (f) {
          $("visor-img").src = f.dataset.src;
          $("visor-titulo").textContent = f.querySelector("figcaption").textContent;
          visor.showModal();
        }
      });
    </script>
  </body>
</html>
