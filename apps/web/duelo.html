<!doctype html>
<html lang="es-PE">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Duelo · Tekluma</title>
    <meta name="description" content="Te retaron a un duelo del RNE: 5 preguntas, un intento cada una. Juega sin instalar nada." />
    <meta property="og:title" content="Te retaron a un duelo del RNE" />
    <meta property="og:description" content="5 preguntas, un intento cada una. ¿Sabes más que tu colega? Juega sin instalar nada." />
    <meta property="og:image" content="https://tekluma.app/og-duelo.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#F6F5F2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F1B2D" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=20261110" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@500;600;700;800&display=swap" />
    <link rel="stylesheet" href="/estilos.css?v=20261110" />
  </head>
  <body>
    <header class="cabecera">
      <div class="hoja">
        <a class="marca" href="/" aria-label="Tekluma, inicio">
          <picture><source srcset="/logo-oscuro.svg?v=20261110" media="(prefers-color-scheme: dark)" /><img src="/logo.svg?v=20261110" alt="Tekluma" width="105" height="26" /></picture>
        </a>
        <nav aria-label="Principal">
          <span class="etq ref">Hoja 02 · Duelo</span>
          <a href="/">Qué es Tekluma</a>
        </nav>
      </div>
    </header>

    <div class="juego-hoja">
      <main class="juego" id="juego" aria-live="polite"><p class="cargando">Cargando el duelo…</p></main>
    </div>

    <footer class="pie">
      <div class="hoja">
        <div class="cajetin">
          <div class="doble"><span class="etq">Proyecto</span><a class="marca-pie" href="/" aria-label="Tekluma, inicio"><picture><source srcset="/logo-oscuro.svg?v=20261110" media="(prefers-color-scheme: dark)" /><img src="/logo.svg?v=20261110" alt="Tekluma" width="81" height="20" /></picture></a></div>
          <div><span class="etq">Lugar</span><span>Lima, Perú</span></div>
          <div><span class="etq">Documentos</span><span class="vinculos"><a href="/terminos">Términos</a><a href="/privacidad">Privacidad</a></span></div>
          <div><span class="etq">Contacto</span><a href="mailto:hola@tekluma.app">hola@tekluma.app</a></div>
          <div><span class="etq">Año</span><span class="mono">© 2026</span></div>
        </div>
      </div>
    </footer>

    <script>
      const API = ["localhost", "127.0.0.1"].includes(location.hostname) ? "http://localhost:8787" : `https://api.${location.hostname}`;
      const raiz = document.getElementById("juego");
      const codigo = (new URLSearchParams(location.search).get("c") || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
      const PREGUNTAS = 5;
      let duelo = null;
      let respuestas = [];
      let inicio = 0;
      let reloj = null;

      const leer = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
      const escribir = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
      // Solo imágenes embebidas (data:image/…) que vienen de la propia API.
      const figura = (u) => (typeof u === "string" && /^data:image\/(jpeg|png|webp);base64,/.test(u) ? `<figure class="figura"><img src="${u}" alt="Figura de la pregunta" /></figure>` : "");
      const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
      const norma = (n) => (n === "RNE" ? "del RNE" : `de la ${n}`);
      const icono = (id, clase = "") => `<svg class="i ${clase}" aria-hidden="true"><use href="/iconos.svg?v=20261110#${id}"/></svg>`;
      const segs = () => Math.floor((Date.now() - inicio) / 1000);

      async function api(ruta, cuerpo) {
        const r = await fetch(API + ruta, cuerpo ? { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(cuerpo) } : {});
        if (!r.ok) throw new Error(await r.text());
        return r.json();
      }

      async function cargar() {
        if (!codigo) return aviso("Este enlace de duelo no es válido.");
        try {
          duelo = await api(`/duelos/${codigo}`);
        } catch {
          return aviso("No encontramos este duelo. Pide a tu colega que te reenvíe el enlace.");
        }
        const mio = leer(`duelo:${codigo}`, null);
        if (mio) {
          // Ya jugué en este navegador: marcador actualizado + mi solución guardada.
          try {
            const r = await api(`/duelos/${codigo}/resultado`);
            r.jugadas.forEach((j) => (j.soyYo = j.nombre === mio.nombre && j.aciertos === mio.aciertos && j.segundos === mio.segundos));
            r.solucion = mio.solucion;
            return marcador(r);
          } catch {}
        }
        presentacion();
      }

      function aviso(texto) {
        raiz.innerHTML = `<p class="aviso">${esc(texto)}</p><a class="btn btn-primario btn-bloque" href="/diaria">Juega la pregunta del día ${icono("i-flecha")}</a>`;
      }

      function presentacion() {
        const nombre = leer("tekluma:nombre", "");
        raiz.innerHTML = `
          <div class="rotulo-juego">
            <div><span class="etq">Duelo 1 vs 1</span><span class="valor">${esc(codigo)}</span></div>
            <div><span class="etq">Norma</span><span class="valor">${esc(duelo.norma)}</span></div>
          </div>
          <section class="duelo-portada">
            <div class="vs" aria-hidden="true">
              <div class="lado"><span class="etq">Retador</span><strong>${esc(duelo.retador)}</strong></div>
              <div class="centro">${icono("i-duelo", "i-l")}</div>
              <div class="lado"><span class="etq">Rival</span><strong>Tú</strong></div>
            </div>
            <h1 class="pregunta">${esc(duelo.retador)} te reta a un duelo ${esc(norma(duelo.norma))}</h1>
            <div class="reglas">
              <div><span class="cifra">5</span><span class="etq">Preguntas</span></div>
              <div><span class="cifra">1</span><span class="etq">Intento c/u</span></div>
              <div><span class="cifra">${icono("i-reloj")}</span><span class="etq">Cuenta el tiempo</span></div>
            </div>
            <p class="ayuda">A igualdad de aciertos gana el más rápido.</p>
            <div class="campo-grupo">
              <label class="etq" for="nombre">Tu nombre</label>
              <input class="campo" id="nombre" maxlength="30" autocomplete="given-name" placeholder="Así te verá tu rival" value="${esc(nombre)}" />
            </div>
            <button class="btn btn-acento btn-bloque" id="empezar">¡Acepto el reto! ${icono("i-flecha")}</button>
          </section>`;
        const campo = document.getElementById("nombre");
        document.getElementById("empezar").addEventListener("click", () => {
          if (campo.value.trim().length < 2) { campo.focus(); campo.classList.add("error"); return; }
          escribir("tekluma:nombre", campo.value.trim());
          respuestas = [];
          inicio = Date.now();
          reloj = setInterval(() => { const r = document.getElementById("reloj"); if (r) r.textContent = `${segs()} s`; }, 250);
          pregunta(0);
        });
      }

      function pregunta(i) {
        const p = duelo.preguntas[i];
        const segmentos = duelo.preguntas.map((_, k) => `<span class="segmento ${k < i ? "hecho" : k === i ? "actual" : ""}"></span>`).join("");
        raiz.innerHTML = `
          <div class="rotulo-juego">
            <div><span class="etq">Duelo ${esc(duelo.norma)}</span><span class="valor">Pregunta ${i + 1} de ${duelo.preguntas.length}</span></div>
            <div><span class="etq">Tiempo</span><span class="valor reloj">${icono("i-reloj")}<span id="reloj">${segs()} s</span></span></div>
          </div>
          <div class="progreso" aria-hidden="true">${segmentos}</div>
          <p class="pregunta">${esc(p.pregunta)}</p>${figura(p.imagenUrl)}
          <div class="opciones">${p.opciones
            .map((t, k) => `<button class="opcion" data-k="${k}"><span class="letra">${"ABCDEF"[k]}</span><span class="texto">${esc(t)}</span></button>`)
            .join("")}</div>`;
        raiz.querySelectorAll(".opcion").forEach((b) =>
          b.addEventListener("click", () => {
            raiz.querySelectorAll(".opcion").forEach((x) => (x.disabled = true));
            b.classList.add("elegida");
            respuestas[i] = Number(b.dataset.k);
            setTimeout(() => (i < duelo.preguntas.length - 1 ? pregunta(i + 1) : enviar()), 300);
          }),
        );
      }

      async function enviar() {
        clearInterval(reloj);
        raiz.innerHTML = `<p class="cargando">Calculando el marcador…</p>`;
        const nombre = leer("tekluma:nombre", "Ingeniero");
        try {
          const r = await api(`/duelos/${codigo}/jugar`, { nombre, respuestas, segundos: (Date.now() - inicio) / 1000 });
          const yo = r.jugadas.find((j) => j.soyYo);
          if (yo) escribir(`duelo:${codigo}`, { nombre: yo.nombre, aciertos: yo.aciertos, segundos: yo.segundos, solucion: r.solucion });
          marcador(r);
        } catch {
          raiz.innerHTML = `<p class="aviso">No pudimos enviar tus respuestas. Revisa tu conexión.</p><button class="btn btn-primario btn-bloque" id="reintentar">Reintentar</button>`;
          document.getElementById("reintentar").addEventListener("click", enviar);
        }
      }

      function marcador(r) {
        const pos = r.jugadas.findIndex((j) => j.soyYo);
        const yo = r.jugadas[pos];
        const titulo = !yo ? "Marcador" : pos === 0 ? "¡Ganaste!" : "Te ganaron esta vez";
        const filas = r.jugadas
          .map((j, i) => `<tr class="${j.soyYo ? "yo" : ""}"><td class="pos">${i === 0 ? icono("i-podio") : String(i + 1).padStart(2, "0")}</td>
            <td class="nombre">${j.soyYo ? "Tú" : esc(j.nombre)}${j.esRetador ? `<span class="marca-retador">RETADOR</span>` : ""}</td>
            <td class="cifra der">${j.aciertos}/5</td><td class="cifra der">${j.segundos} s</td></tr>`)
          .join("");
        const revision = (r.solucion || [])
          .map((s, i) => {
            const p = duelo.preguntas.find((q) => q.id === s.id);
            if (!p) return "";
            const bien = s.elegida === s.correcta;
            return `<li class="revision ${bien ? "ok" : "ko"}">${icono(bien ? "i-bien" : "i-mal")}<span class="q"><span class="mono">${String(i + 1).padStart(2, "0")}</span>${esc(p.pregunta)}</span>
              <span class="det">
              ${!bien && s.elegida !== null ? `<span class="tuya"><b>Tu respuesta</b>${esc(p.opciones[s.elegida])}</span>` : ""}
              <span class="correcta"><b>Correcta</b>${esc(p.opciones[s.correcta])}</span>
              ${s.explicacion ? `<span>${esc(s.explicacion)}</span>` : ""}</span></li>`;
          })
          .join("");
        const texto = yo
          ? `⚔️ Acepté un duelo ${norma(r.norma)} en Tekluma y saqué ${yo.aciertos}/5 en ${yo.segundos} s. ¿Me ganas?\n${location.origin}/duelo?c=${r.codigo}`
          : `⚔️ Duelo ${norma(r.norma)} en Tekluma. ¿Te animas?\n${location.origin}/duelo?c=${r.codigo}`;
        raiz.innerHTML = `
          <section class="resultado">
            <div class="resultado-cab"><span class="etq">Duelo ${esc(r.norma)} · ${esc(r.codigo)}</span>${yo ? `<span class="etq"><b>${yo.aciertos}/5 · ${yo.segundos} s</b></span>` : ""}</div>
            <h2>${yo ? icono(pos === 0 ? "i-podio" : "i-duelo") : ""}${titulo}</h2>
            <div class="acciones">
              <a class="btn btn-acento" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(texto)}">${icono("i-enviar")}Retar a otro con este duelo</a>
              <a class="btn btn-linea" href="tekluma://duelo/nuevo">${icono("i-duelo")}Pide la revancha en la app</a>
            </div>
            <p class="nota">En la app: crea tus propios duelos, pregunta del día con monedas y repaso de todo el RNE. Muy pronto en App Store y Google Play.</p>
          </section>
          <section class="bloque">
            <span class="etq">Marcador</span>
            <table class="tabla">
              <thead><tr><th>Pos.</th><th>Nombre</th><th class="der">Aciertos</th><th class="der">Tiempo</th></tr></thead>
              <tbody>${filas}</tbody>
            </table>
          </section>
          ${revision ? `<section class="bloque"><span class="etq">Tus respuestas</span><ol class="revisiones">${revision}</ol></section>` : ""}`;
      }

      cargar();
    </script>
  </body>
</html>
